name: 每日私人台股掃描
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: private-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: data
          key: private-history-${{ github.run_id }}
          restore-keys: private-history-
      - run: python -m unittest discover -s tests -v
      - name: 掃描並產生可離線開啟的私人報告
        run: |
          python scan_daily.py
          python build_private.py
      - name: 更新登入保護的 Cloudflare 網站
        if: vars.CLOUDFLARE_SYNC_ENABLED == 'true'
        env:
          RADAR_URL: ${{ vars.RADAR_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RADAR_UPDATE_SECRET: ${{ secrets.RADAR_UPDATE_SECRET }}
        run: python cloudflare/upload.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-stock-radar
          path: private-report/
          retention-days: 7
